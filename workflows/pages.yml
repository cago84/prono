name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Écrit web/js/config.js avec l'adresse et la clé PUBLIQUE du projet (variables du dépôt, pas des secrets)
      - name: Générer la configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Variables SUPABASE_URL et SUPABASE_PUBLISHABLE_KEY manquantes (Settings > Secrets and variables > Actions > Variables)." >&2
            exit 1
          fi
          node -e "
            const fs = require('fs');
            const cfg = { supabaseUrl: process.env.SUPABASE_URL.trim(), supabaseKey: process.env.SUPABASE_KEY.trim() };
            if (/service_role|sb_secret_/.test(cfg.supabaseKey)) { console.error('Cette clé est une clé secrète : utilisez la clé publique.'); process.exit(1); }
            fs.writeFileSync('web/js/config.js', 'export const config = ' + JSON.stringify(cfg, null, 2) + ';\n');
          "

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
